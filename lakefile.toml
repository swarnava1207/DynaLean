name = "DynaLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DynaLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "DynaLean"
# Without this, Lake builds only the root module `DynaLean` and whatever it
# transitively imports -- which is just `Basic` and `Defs`. Every other file
# would go unchecked by `lake build` and by CI. `DynaLean.*` means the root
# module together with all submodules, recursively.
globs = ["DynaLean.*"]
